# Installable automation workspace and agent mode.
- insert:
    - id: device-automation-presets
      name: '@fadinglight/dsh-device-automation'

    - id: device-automation-runtime
      name: '@fadinglight/dsh-device-automation-runtime'
      config:
        defaultProvider: harmonyos
        refreshMs: 100
        maxFileBytes: 1048576
        maxDirectoryEntries: 1000

    - id: device-automation-harmonyos
      name: '@fadinglight/dsh-device-automation-harmonyos'

    - id: ui-device-automation
      name: '@fadinglight/dsh-client-ui-device-automation'
